services:
  # -----------------------------------------------------------
  # Backend API (FastAPI + Python 3)
  # -----------------------------------------------------------
  - type: web
    name: aquaxfoul-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt psycopg[binary]
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aquaxfoul-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: DEBUG
        value: "false"

  # -----------------------------------------------------------
  # Frontend Web App (React + Vite)
  # -----------------------------------------------------------
  - type: static
    name: aquaxfoul-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://aquaxfoul-backend.onrender.com/api/v1

databases:
  # -----------------------------------------------------------
  # Managed PostgreSQL Database (Free Tier)
  # -----------------------------------------------------------
  - name: aquaxfoul-db
    plan: free
    databaseName: aquaxfoul
    user: aquaxfoul_user
